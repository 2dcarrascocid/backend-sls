obtenerJugadorPorId:
  handler: routes/jugadores/obtenerPorId.handler
  events:
    - httpApi:
        path: /jugadores/{id}
        method: get

crearJugador:
  handler: routes/jugadores/crear.handler
  events:
    - httpApi:
        path: /jugadores
        method: post

actualizarJugador:
  handler: routes/jugadores/actualizar.handler
  events:
    - httpApi:
        path: /jugadores/actualizar
        method: put


