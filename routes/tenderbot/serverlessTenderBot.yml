# Planes
listarPlanes:
  handler: routes/tenderbot/planes_list.handler
  events:
    - httpApi:
        path: /tenderbot/planes
        method: get

obtenerPlan:
  handler: routes/tenderbot/planes_get.handler
  events:
    - httpApi:
        path: /tenderbot/planes/{id}
        method: get

crearPlan:
  handler: routes/tenderbot/planes_create.handler
  events:
    - httpApi:
        path: /tenderbot/planes
        method: post

actualizarPlan:
  handler: routes/tenderbot/planes_update.handler
  events:
    - httpApi:
        path: /tenderbot/planes/{id}
        method: patch

