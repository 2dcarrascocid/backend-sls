service: backend-sls
frameworkVersion: '>=4.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY}
    USE_DB_MOCK: ${env:USE_DB_MOCK}
    API_KEY: ${env:API_KEY}

  httpApi:
    cors:
      allowedOrigins:
        - '*'                # todos los orígenes
      allowedHeaders:
        - '*' 
      allowedMethods:
        - '*'  
      allowCredentials: false
      
functions:
  - ${file(./routes/login/serverlessLogin.yml)}
  - ${file(./routes/partidos/serverlessPartidos.yml)}
  - ${file(./routes/jugadores/serverlessJugadores.yml)}

plugins:
  - serverless-offline
  

package:
  individually: true
  exclude:
    - node_modules/**
    - .serverless/**
    - .webpack/**
    - logs/**
    - tmp/**
    - data/**
    - "**/*.map"
    - "**/*.zip"
    - "**/*.md"
    - "**/*.log"




build:
  esbuild:
    bundle: true
    minify: true
    target: node20
    platform: node
    external:
      - aws-sdk

custom:
  serverless-offline:
    disableCookieValidation: true
      
