service: backend-sls
frameworkVersion: '>=4.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY}
    USE_DB_MOCK: ${env:USE_DB_MOCK}
    API_KEY: ${env:API_KEY}

  # Esto aplica solo en AWS, no afecta a serverless-offline
  apiGateway:
    apiKeys:
      - name: FplayChileApiKey
        value: ${env:API_KEY}

functions:

  createPartido:
    handler: routes/partidos/create.handler
    events:
      - httpApi:
          path: /api/partidos
          method: post

  buscarPartidos:
    handler: routes/partidos/buscar.handler
    events:
      - httpApi:
          path: /partidos/buscar
          method: get

  partidoAsistencia:
    handler: routes/partidos/asistencia.handler
    events:
      - httpApi:
          path: /partidos/asistencia
          method: get
      - httpApi:
          path: /partidos/asistencia
          method: post
      - httpApi:
          path: /partidos/asistencia
          method: delete

  asistenciaEstado:
    handler: routes/partidos/asistencia_estado.handler
    events:
      - httpApi:
          path: /partidos/asistencia-estado
          method: get
      - httpApi:
          path: /partidos/asistencia-estado
          method: post
      - httpApi:
          path: /partidos/asistencia-estado
          method: delete

  calificarPartido:
    handler: routes/partidos/calificar.handler
    events:
      - httpApi:
          path: /partidos/calificar
          method: get
      - httpApi:
          path: /partidos/calificar
          method: post
      - httpApi:
          path: /partidos/calificar
          method: delete

  partidosJugador:
    handler: routes/partidos/jugadores_partidos.handler
    events:
      - httpApi:
          path: /partidos/jugador
          method: get

  swaggerDocs:
    handler: routes/swagger/swaggerDocs.handler
    events:
      - http:
          path: api/docs
          method: get
          cors: true

plugins:
  - serverless-offline

package:
  individually: true
  exclude:
    - .git/**
    - test/**
    - docs/**
    - .env
    - README.md
    - awscliv2.zip

custom:
  esbuild:
    bundle: true
    minify: true
    target: node20
    platform: node
    external:
      - aws-sdk
